name: _Lint

on:
  workflow_call:
    
jobs:
  lint:
    runs-on: ${{ vars.MACOS_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Verify Swift 5.10 toolchain
        run: swift package dump-package > /dev/null
      - name: Install SwiftLint
        run: |
          brew install swiftlint
          swiftlint version
      - name: Run SwiftLint rules
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging
      - name: Run SwiftLint analyzer rules
        run: bash scripts/swiftlint-analyze.sh
